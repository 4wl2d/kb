# Release workflow: builds the versioned kb archives for macOS arm64, Linux x86_64 and arm64
# (static, musl) and Windows x86_64 with `kb engine package`, verifies each with its installer
# (install.sh, install.ps1), `kb self update` and `kb engine install`, writes SHA256SUMS and
# creates a GitHub release. It has not published anything by itself; a release exists only after an owner
# pushes a tag and this workflow succeeds.
#
# Prerequisites (administrator/owner actions, not guaranteed by this file):
#   * GitHub Actions is enabled for the repository.
#   * The organization/repository policy allows GITHUB_TOKEN to be granted
#     `contents: write`; only the final `publish` job requests it.
#   * A maintainer bumps `engine_version` in core/release.toml (and core/cli/Cargo.toml)
#     through review, then pushes a tag `v<engine_version>` pointing at the reviewed
#     commit, e.g. `git tag -s v0.1.0 && git push origin v0.1.0`. Protecting `v*` tags with
#     a ruleset limits who can trigger a release.
#   * `workflow_dispatch` rebuilds an existing tag (for example after a runner outage); it
#     does not create tags.
#
# Consumers install the kb command with install.sh or install.ps1 (or update it with
# `kb self update`), which verify the archive against SHA256SUMS of the same release before
# using it. As an engine runtime (`kb engine install`) an archive only activates when its
# BUILD-INFO fingerprint equals the checkout's engine. The Linux binaries are statically
# linked and need no particular glibc.
#
# Downstream opt-out: every downstream fork inherits this engine-owned file (core/release.toml
# engine_paths), and editing or deleting it is reported as engine divergence by
# `kb update divergence`. A downstream that does not publish its own runtime archives sets
# the repository variable KB_RELEASE to `disabled` (Settings > Secrets and variables >
# Actions > Variables, or `gh variable set KB_RELEASE --body disabled`): every job is then
# skipped, so pushing a `v*` tag builds and publishes nothing. Any other value, or no
# variable, keeps the release enabled.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    # Downstream opt-out without editing this file (see the header).
    if: vars.KB_RELEASE != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Tag must equal v + engine_version
        id: version
        run: |
          set -eu
          version=$(sed -n 's/^engine_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' core/release.toml)
          crate=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*$/\1/p' core/cli/Cargo.toml | head -n 1)
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::tag '$TAG' does not match engine_version '$version' in core/release.toml"
            exit 1
          fi
          if [ "$crate" != "$version" ]; then
            echo "::error::core/cli/Cargo.toml version '$crate' differs from engine_version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: verify
    if: vars.KB_RELEASE != 'disabled'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          # Linux archives are static (musl), so they run on any distribution.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      KB_CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version

      - name: Install the musl C toolchain (bundled SQLite)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build the release archive
        # A host kb packages the engine of this tag: cargo build --release --locked -p kb
        # --target $TARGET with the pinned toolchain, a smoke run of the result, then
        # dist/kb-<version>-<target>.tar.gz plus its .sha256 file.
        run: |
          cargo build --release --locked -p kb
          target/release/kb engine package dist --target "$TARGET"

      - name: Lay out the archive as a release (local stand-in for KB_RELEASES_URL)
        run: |
          set -eu
          archive="kb-$VERSION-$TARGET.tar.gz"
          test -f "dist/$archive"
          for dir in "download/v$VERSION" latest/download; do
            mkdir -p "$RUNNER_TEMP/releases/$dir"
            cp "dist/$archive" "$RUNNER_TEMP/releases/$dir/"
            cp "dist/$archive.sha256" "$RUNNER_TEMP/releases/$dir/SHA256SUMS"
          done
          cat "dist/$archive.sha256"

      - name: Verify the archive with install.sh and kb self update
        if: runner.os != 'Windows'
        env:
          KB_RELEASES_URL: ${{ runner.temp }}/releases
          KB_RUNTIME_DIR: ${{ runner.temp }}/kb-runtime
        run: |
          set -eu
          sh install.sh --version "$VERSION" --dir "$RUNNER_TEMP/kb-bin"
          installed="$RUNNER_TEMP/kb-bin/kb"
          test "$("$installed" --version)" = "kb $VERSION"
          "$installed" self update --force
          "$installed" engine install
          "$installed" engine info
          "$installed" version

      - name: Verify the archive with install.ps1 and kb self update
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          KB_RELEASES_URL: ${{ runner.temp }}\releases
          KB_RUNTIME_DIR: ${{ runner.temp }}\kb-runtime
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1 -Version $env:VERSION -Dir "$env:RUNNER_TEMP\kb-bin" -NoPathUpdate
          $installed = "$env:RUNNER_TEMP\kb-bin\kb.exe"
          if ((& $installed --version) -ne "kb $env:VERSION") { throw 'unexpected kb version' }
          foreach ($args_ in @(@('self', 'update', '--force'), @('engine', 'install'), @('engine', 'info'), @('version'))) {
            & $installed @args_
            if ($LASTEXITCODE -ne 0) { throw "kb $($args_ -join ' ') exited with $LASTEXITCODE" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: kb-${{ matrix.target }}
          path: |
            dist/kb-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/kb-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: [verify, build]
    if: vars.KB_RELEASE != 'disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: kb-*
          merge-multiple: true

      - name: Verify archives and write SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          export LC_ALL=C
          for sum in *.sha256; do sha256sum -c "$sum"; done
          set -- kb-*.tar.gz
          test "$#" -eq 4
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        run: |
          set -eu
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "kb $VERSION" \
            --notes "kb $VERSION for aarch64-apple-darwin, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl and x86_64-pc-windows-msvc. Install with install.sh (macOS, Linux) or install.ps1 (Windows) from this tag, or update an installed kb with `kb self update`; each verifies the archive against SHA256SUMS. As an engine runtime (`kb engine install`) an archive serves only a checkout whose engine fingerprint matches its BUILD-INFO." \
            dist/kb-*.tar.gz dist/kb-*.tar.gz.sha256 dist/SHA256SUMS

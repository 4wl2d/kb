# kb knowledge checks for a downstream KB repository on GitLab. Include this file from
# .gitlab-ci.yml (`include: local: core/templates/ci/gitlab/kb-knowledge.gitlab-ci.yml`) or
# copy the job. The checks report problems; protected branches, required approvals and
# "pipelines must succeed" are project settings configured by a maintainer.
kb-knowledge:
  image: rust:1
  variables:
    # Full history: `validate --base` and `update divergence` compare with older commits.
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: none
    # Runtime store and Cargo build directory of `kb engine bootstrap` (cached below).
    KB_RUNTIME_DIR: $CI_PROJECT_DIR/.cache/kb-runtime
    KB_CARGO_TARGET_DIR: $CI_PROJECT_DIR/.cache/cargo-target
  cache:
    key:
      # GitLab accepts at most two files here; runtimes are stored by engine fingerprint,
      # so this key only affects cache reuse.
      files: [Cargo.lock, core/release.toml]
    paths: [.cache/kb-runtime, .cache/cargo-target]
  artifacts:
    when: always
    paths: [.cache/knowledge-ci/]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # kb for this checkout: its release, else a source build; explicit engine bootstrap.
    - sh core/templates/ci/install-kb.sh . "$CI_PROJECT_DIR/.cache/kb-bin"
    - export PATH="$CI_PROJECT_DIR/.cache/kb-bin:$PATH"
    # Provision read-only hosts pinned in project/ci/hosts.tsv before this step.
    - sh core/templates/ci/check-knowledge.sh
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --no-tags origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        kb validate --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      fi
    - kb integrate --generate --check
    - kb update divergence
    - kb schema --check

# kb knowledge checks for a downstream KB repository (installed by `kb init` as
# .github/workflows/kb-knowledge.yml). These checks report problems; they do not enforce
# reviews. Branch protection, required checks and approval rules are configured separately
# by a repository administrator.
name: kb-knowledge

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    env:
      # Runtime store and Cargo build directory of `kb engine bootstrap` (cached below).
      KB_RUNTIME_DIR: ${{ github.workspace }}/.cache/kb-runtime
      KB_CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: `validate --base` and `update divergence` compare with older commits.
          fetch-depth: 0

      - name: Cache kb engine runtimes and builds
        uses: actions/cache@v6
        with:
          path: |
            .cache/kb-runtime
            .cache/cargo-target
          key: kb-engine-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'core/release.toml', 'core/cli/**') }}

      - name: Install kb for this checkout (release, else a source build; explicit engine bootstrap)
        run: |
          sh core/templates/ci/install-kb.sh . "$RUNNER_TEMP/kb-bin"
          echo "$RUNNER_TEMP/kb-bin" >> "$GITHUB_PATH"

      # Add read-only host checkouts at the SHAs declared in project/ci/hosts.tsv.
      # Missing source evidence fails explicitly; it is not a skipped success.
      - name: Strict validation, routing metrics, anchors, drift queue and ledger
        run: sh core/templates/ci/check-knowledge.sh

      - name: Preserve knowledge reports and native exit statuses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-evidence
          path: .cache/knowledge-ci/
          include-hidden-files: true
          if-no-files-found: error

      - name: Historical ids stay addressable (against the target branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: kb validate --base "origin/$BASE_REF"

      - name: Generated skill bundle matches project/skill-config
        run: kb integrate --generate --check

      - name: Engine-owned paths match the recorded upstream base
        run: kb update divergence

      - name: JSON schemas match the engine
        run: kb schema --check

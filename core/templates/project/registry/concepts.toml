# Concepts: domain vocabulary that routes task text to knowledge. Aliases are matched on
# whole normalized tokens (NFKC, lowercase, `ё`→`е`, punctuation → space); a trailing `*`
# matches the last token by prefix. There is no stemming: list variants or use `*`.
# Aliases shared by several concepts are reported as ambiguities unless task paths match a
# concept's `paths` hints.
schema = 2


# Expected verdicts for the fixtures in invalid/ (read by tests/schema_conformance.rs).
#
# code:   a diagnostic code the strict parser (`parse::parse_record`) must report.
# schema: "reject"      the defect is expressible in JSON Schema: the generated record
#                       schema must reject the front matter too;
#         "accept"      runtime-only rule (listed in core/schemas/README.md): the schema
#                       accepts, only the parser rejects;
#         "no-instance" the file has no JSON form (front matter missing or not TOML).
#
# Every fixture in valid/ must be accepted by both the parser and the schema.

[cases]
# Unknown fields, wrong types, bad enums, missing required fields.
"policy-unknown-field.md" = { code = "FRONT_MATTER_INVALID", schema = "reject" }
"policy-unknown-nested-field.md" = { code = "FRONT_MATTER_INVALID", schema = "reject" }
"feature-wrong-type.md" = { code = "FRONT_MATTER_INVALID", schema = "reject" }

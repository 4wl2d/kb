schema = 1

[[case]]
name = "changing the index pulls determinism and completeness obligations"
relevant = ["kb.invariant.deterministic-context", "kb.invariant.mandatory-completeness"]
recall_k = 6
min_recall_percent = 100
expect_order = ["kb.policy.engine-changes-upstream", "kb.invariant.deterministic-context", "kb.invariant.mandatory-completeness"]
max_tokens = 1800
intent = "implement"
repos = ["kb"]
paths = ["core/cli/src/index/mod.rs"]
expect_mandatory = [
  "kb.policy.engine-changes-upstream",
  "kb.policy.test-isolation",
  "kb.invariant.deterministic-context",
  "kb.invariant.mandatory-completeness",
]
forbid = ["kb.invariant.read-only-knowledge-queries", "kb.gap.cursor-duplicate-skill"]
expect_status = "complete"

[[case]]
name = "snapshot work pulls the read-only invariant"
intent = "debug"
repos = ["kb"]
paths = ["core/cli/src/overlay.rs"]
task = "proposal overlay shows stale revision"
expect_mandatory = ["kb.invariant.read-only-knowledge-queries", "kb.policy.engine-changes-upstream"]
expect_included = ["kb.decision.isolated-mirror"]

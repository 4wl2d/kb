[[case]]
name = "skill template changes include the protocol contract and the known gap"
intent = "implement"
repos = ["kb"]
paths = ["core/skills/kb/SKILL.md.tmpl"]
expect_mandatory = ["kb.contract.cli-protocol", "kb.gap.cursor-duplicate-skill"]
